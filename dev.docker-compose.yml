version: "3.8"

services:
  # Redis for Queue Management
  redis:
    image: redis:7-alpine
    container_name: bullreckon-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --save "" --appendonly no
    networks:
      - bullreckon-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 5s

  # Auth Server
  auth-server:
    build:
      context: .
      dockerfile: apps/auth_server/Dockerfile
      target: development
    container_name: bullreckon-auth
    restart: unless-stopped
    ports:
      - "4000:4000"
    env_file:
      - .env
      - apps/auth_server/.env
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - bullreckon-network
    volumes:
      - ./apps/auth_server:/app/apps/auth_server
      - ./shared:/app/shared
      - ./types:/app/types
      - ./middleware:/app/middleware
      - ./tsconfig.json:/app/tsconfig.json
      - /app/node_modules
      - /app/apps/auth_server/node_modules

  # Market Server
  market-server:
    build:
      context: .
      dockerfile: apps/market_server/Dockerfile
      target: development
    container_name: bullreckon-market
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - .env
      - apps/market_server/.env
    environment:
      NODE_ENV: ${NODE_ENV:-development}
    networks:
      - bullreckon-network
    volumes:
      - ./apps/market_server:/app/apps/market_server
      - ./shared:/app/shared
      - ./types:/app/types
      - ./middleware:/app/middleware
      - ./tsconfig.json:/app/tsconfig.json
      - /app/node_modules
      - /app/apps/market_server/node_modules

  # Calc Server
  calc-server:
    build:
      context: .
      dockerfile: apps/calc_server/Dockerfile
      target: development
    container_name: bullreckon-calc
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
      - apps/calc_server/.env
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      AUTH_SERVER_URL: http://auth-server:4000
      MARKET_SERVER_URL: http://market-server:5000
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      redis:
        condition: service_healthy
      auth-server:
        condition: service_started
      market-server:
        condition: service_started
    networks:
      - bullreckon-network
    volumes:
      - ./apps/calc_server:/app/apps/calc_server
      - ./shared:/app/shared
      - ./types:/app/types
      - ./middleware:/app/middleware
      - ./tsconfig.json:/app/tsconfig.json
      - /app/node_modules
      - /app/apps/calc_server/node_modules

  # Code Server
  code-server:
    build:
      context: .
      dockerfile: apps/code_server/Dockerfile
      target: development
    container_name: bullreckon-code
    restart: unless-stopped
    ports:
      - "2000:2000"
    env_file:
      - .env
      - apps/code_server/.env
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      AUTH_SERVER_URL: http://auth-server:4000
      MARKET_SERVER_URL: http://market-server:5000
      API_SERVER_URL: http://api-nginx:3004
    depends_on:
      redis:
        condition: service_healthy
      auth-server:
        condition: service_started
      market-server:
        condition: service_started
    networks:
      - bullreckon-network
    volumes:
      - ./apps/code_server:/app/apps/code_server
      - ./shared:/app/shared
      - ./types:/app/types
      - ./middleware:/app/middleware
      - ./tsconfig.json:/app/tsconfig.json
      - /app/node_modules
      - /app/apps/code_server/node_modules

  # API Server
  api-server:
      build:
        context: .
        dockerfile: apps/api_server/Dockerfile
        target: development
      container_name: bullreckon-api
      restart: unless-stopped
      ports:
        - "3004:3004"
      env_file:
        - .env
        - apps/api_server/.env
      environment:
        NODE_ENV: ${NODE_ENV:-development}
        AUTH_SERVER_URL: http://auth-server:4000
        MARKET_SERVER_URL: http://market-server:5000
        CALC_SERVER_URL: http://calc-server:8000
      depends_on:
        - auth-server
        - market-server
        - calc-server
      networks:
        - bullreckon-network
      volumes:
        - ./apps/api_server:/app/apps/api_server
        - ./shared:/app/shared
        - ./types:/app/types  
        - ./middleware:/app/middleware
        - ./tsconfig.json:/app/tsconfig.json
        - /app/node_modules
        - /app/apps/api_server/node_modules

  # Transcript Server (Python/FastAPI)
  transcript-server:
    build:
      context: .
      dockerfile: apps/transcript_server/dev.Dockerfile
    container_name: bullreckon-transcript
    restart: unless-stopped
    ports:
      - "5006:5006"
    env_file:
      - .env
    environment:
      TRANSCRIPT_SERVER_PORT: 5006
      TRANSCRIPT_SERVER_HOST: 0.0.0.0
      DEBUG: "true"
      LOG_LEVEL: DEBUG
      CORS_ORIGINS: "*"
      REQUIRE_AUTH: "false"
      AUTH_SERVICE_URL: http://auth-server:4000
      JWT_SECRET: ${JWT_SECRET:-default-secret}
    depends_on:
      - auth-server
    networks:
      - bullreckon-network
    volumes:
      - ./apps/transcript_server:/app/apps/transcript_server
      - ./shared:/app/shared

  # Web Frontend (Next.js)
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: development
    container_name: bullreckon-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      NEXT_PUBLIC_AUTH_SERVER: http://localhost:4000
      NEXT_PUBLIC_MARKET_SERVER: http://localhost:5000
      NEXT_PUBLIC_CALC_SERVER: http://localhost:8000
      NEXT_PUBLIC_API_SERVER: http://localhost:3004
      NEXT_PUBLIC_TRANSCRIPT_SERVER: http://localhost:5006
      NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    depends_on:
      - auth-server
      - market-server
      - calc-server
      - api-server
      - code-server
      - transcript-server
    networks:
      - bullreckon-network
    volumes:
      - ./apps/web:/app/apps/web
      - ./shared:/app/shared
      - ./types:/app/types
      - /app/node_modules
      - /app/apps/web/node_modules
      - /app/apps/web/.next

networks:
  bullreckon-network:
    driver: bridge

volumes:
  redis_data:
    driver: local

