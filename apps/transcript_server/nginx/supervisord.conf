[supervisord]
nodaemon=true
user=root

[program:transcript_server]
command=uvicorn server:app --host 0.0.0.0 --port 5006 --workers 4
directory=/app/apps/transcript_server
autostart=true
autorestart=true
stderr_logfile=/var/log/transcript_server.err.log
stdout_logfile=/var/log/transcript_server.out.log
user=appuser

